trigger:
  branches:
    include:
    - main

pool:
  name: Default

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: mkdir build
    - script: touch build/InventoryAPI.zip
    - script: touch build/BillingAPI.zip
    - script: touch build/README.txt
    - script: mkdir package
    - task: CopyFiles@2
      inputs:
        SourceFolder: build
        Contents: '*.zip'
        TargetFolder: package
    - script: ls -ltr package
