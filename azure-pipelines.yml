trigger:
  branches:
    include:
    - main

pool:
  name: Default

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: echo "Compiling..."
    - script: mkdir build
    - script: touch build/app.dll
    - script: touch build/README.txt
    - script: touch build/notes.txt
    - script: touch build/script.sh
    - script: mkdir packages
    - task: CopyFiles@2
      inputs:
        SourceFolder: build
        Contents: |
          **
          !notes.txt
        TargetFolder: '$(Build.BinariesDirectory)/packages'
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.BinariesDirectory)/packages'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.BinariesDirectory)/artifactsAPP.zip'
        replaceExistingArchive: true
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.BinariesDirectory)/artifactsAPP.zip'
        artifact: buildArtifact
        publishLocation: pipeline

- stage: Deploy
  jobs:
    - job: DeployJob
      steps:
      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: current
          targetPath: deployArtifacts
          artifact: buildArtifact
      - script: ls -ltr deployArtifacts
