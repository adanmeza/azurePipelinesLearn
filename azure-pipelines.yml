trigger:
  branches:
    include:
      - main

pool:
  name: Default

stages:
  - stage: learningDirectories
    jobs:
      - job: directoriesJob
        steps:
        - script: echo "$(Build.SourcesDirectory)"
        - script: echo "$(Build.BinariesDirectory)"
        - script: echo "$(Build.ArtifactStagingDirectory)"
        - script: echo "$(Pipeline.Workspace)"
        - script: echo "$(Agent.TempDirectory)"
        - script: ls -la $(Build.SourcesDirectory)
        - script: ls -la $(Build.BinariesDirectory)
        - script: ls -la $(Build.ArtifactStagingDirectory)
        - script: touch $(Build.ArtifactStagingDirectory)/hello.txt
        - script: ls -la $(Build.ArtifactStagingDirectory)
