trigger:
  branches:
    include:
      - main

pool:
  name: Default

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        steps:
        - script: echo "Compiling"
        - script: mkdir bin
        - script: touch bin/InventoryAPI.dll
        - script: touch bin/InventoryAPI.pdb
        - script: touch bin/appsettings.json
        - script: touch bin/README.md
        - task: CopyFiles@2
          inputs:
            SourceFolder: $(Build.SourcesDirectory)/bin
            Contents: |
              InventoryAPI.dll
              appsettings.json
            TargetFolder: '$(Build.ArtifactStagingDirectory)'
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: 'InventoryAPI_$(Build.BuildId).zip'
            replaceExistingArchive: true
        - script: |
            echo "Sources:"
            ls -R $(Build.SourcesDirectory)
        - script: |
            echo "Binaries:"
            ls -R $(Build.BinariesDirectory)

        - script: |
            echo "Artifacts:"
            ls -R $(Build.ArtifactStagingDirectory)
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifact: 'artifact'
            publishLocation: 'pipeline'
  - stage: DeployDev
    jobs:
      - job: DeployJob
        steps:
        - task: DownloadPipelineArtifact@2
          inputs:
            buildType: 'current'
            artifactName: 'InventoryAPI_$(Build.BuildId).zip'
            targetPath: '$(Pipeline.Workspace)'
        - script: ls -ltr '$(Pipeline.Workspace)'
        - script: echo "Deploying InventoryAPI to Development..."

            